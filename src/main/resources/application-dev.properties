# ===== DEV PROFILE - H2 In-Memory Database =====
spring.datasource.url=jdbc:h2:mem:airbnbdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (access at http://localhost:8080/api/v1/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret (dev only - NOT for production)
jwt.secretKey=dev-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-needs-256-bits

# Frontend URL
frontend.url=http://localhost:3000

# Stripe (use test keys from your Stripe dashboard, or dummy values to start the app)
stripe.secret.key=sk_test_placeholder
stripe.webhook.secret=whsec_test_placeholder
