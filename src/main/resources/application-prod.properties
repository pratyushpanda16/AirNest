# ===== PRODUCTION PROFILE =====

# DB Configuration (set via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate - use 'update' for initial deployment, switch to 'validate' once stable
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Connection pool (optimized for Render free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JWT
jwt.secretKey=${JWT_SECRET}

# Frontend URL
frontend.url=${FRONTEND_URL}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Server
server.servlet.context-path=/api/v1
server.port=8080

# Actuator - expose health endpoint only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.root=WARN
logging.level.com.aman.AirBnb=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
